<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | America First Speakers</title>
  <link rel="stylesheet" href="sign-up.css" />
</head>
<body>
  <header class="header">
    <h1>Join America First Speakers</h1>
    <p>Sign up to access exclusive updates and speaker opportunities.</p>
  </header>

  <section class="signup-container">
    <form class="signup-form">
      <h2>Create Your Account</h2>

      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required />
      </div>

      <button type="submit" class="btn-signup">Sign Up</button>

      <p class="login-link">
        Already have an account? <a href="Log-in.html">Log In</a>
      </p>
    </form>
  </section>

  <footer class="footer">
    <p>© 2024 America First Speakers. All rights reserved.</p>
  </footer>
</body>
</html>
